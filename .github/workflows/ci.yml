name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # nooa는 fcntl 의존으로 Linux/macOS 전용 — CI가 정본 검증 환경 (Windows 로컬은 Docker 경유)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
