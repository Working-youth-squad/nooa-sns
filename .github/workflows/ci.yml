name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # nooa는 fcntl 의존으로 Linux/macOS 전용 — CI가 정본 검증 환경 (Windows 로컬은 Docker 경유)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sns
          POSTGRES_PASSWORD: sns
          POSTGRES_DB: sns
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sns"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://sns:sns@localhost:5432/sns
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg + Noto CJK fonts (렌더 테스트)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
