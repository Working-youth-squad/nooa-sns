[project]
name = "sns"
version = "0.1.0"
description = "NOOA(CodeAct) 기반 멀티에이전트 SNS 성장 엔진"
readme = "README.md"
authors = [
    { name = "gyu", email = "biop99999@gmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "cryptography>=44",
    # NFR-5: Alpha API 변동 흡수 — 정확 버전 고정, 업그레이드는 어댑터(FR-C8) 수정 PR로만
    "google-api-python-client>=2.198.0",
    "google-auth-oauthlib>=1.4.0",
    "google-cloud-texttospeech>=2.37.0",
    "httpx>=0.28.1",
    "nooa==0.0.9",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# PIE790 금지: NOOA 생성 메서드는 docstring 뒤 `...` 본문이 프레임워크 계약 —
# 이 규칙이 `...`를 삭제하면 생성 메서드 탐지가 조용히 꺼진다 (2026-08-20 실사고).
ignore = ["PIE790"]

[tool.ruff.lint.per-file-ignores]
# 원본 multiagent-sns 무수정 이식분 — 의도된 패턴(장애 삼킴 불변식·수동 returncode 처리)
"src/sns/notify/dispatch.py" = ["BLE001"]
"src/sns/research/trends.py" = ["BLE001"]
"src/sns/research/sources/naver_datalab.py" = ["DTZ011"]
"src/sns/render/video/*.py" = ["PLW1510", "RUF028", "ISC004"]
"tests/test_notify_discord.py" = ["PYI034"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["sns"]

# nooa 0.0.9는 py.typed 미제공(Alpha) — 어댑터 경계(FR-C8)에서만 완화.
[[tool.mypy.overrides]]
module = "nooa.*"
ignore_missing_imports = true
follow_untyped_imports = false

# 구글 API 클라이언트도 스텁 미제공 — 어댑터 경계에서만 완화 (원본 관례 동일).
[[tool.mypy.overrides]]
module = ["googleapiclient.*", "google_auth_oauthlib.*", "google.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sns.agents.*"
disallow_subclassing_any = false
disallow_untyped_decorators = false
disable_error_code = ["empty-body", "no-any-unimported"]
