[project]
name = "sns"
version = "0.1.0"
description = "NOOA(CodeAct) 기반 멀티에이전트 SNS 성장 엔진"
readme = "README.md"
authors = [
    { name = "gyu", email = "biop99999@gmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "cryptography>=44",
    # NFR-5: Alpha API 변동 흡수 — 정확 버전 고정, 업그레이드는 어댑터(FR-C8) 수정 PR로만
    "nooa==0.0.9",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# PIE790 금지: NOOA 생성 메서드는 docstring 뒤 `...` 본문이 프레임워크 계약 —
# 이 규칙이 `...`를 삭제하면 생성 메서드 탐지가 조용히 꺼진다 (2026-08-20 실사고).
ignore = ["PIE790"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["sns"]

# nooa 0.0.9는 py.typed 미제공(Alpha) — 어댑터 경계(FR-C8)에서만 완화.
[[tool.mypy.overrides]]
module = "nooa.*"
ignore_missing_imports = true
follow_untyped_imports = false

[[tool.mypy.overrides]]
module = "sns.agents.*"
disallow_subclassing_any = false
disallow_untyped_decorators = false
disable_error_code = ["empty-body", "no-any-unimported"]
